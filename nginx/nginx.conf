  # 正式环境
    server {
         listen 443 ssl;  # 监听443端口
         server_name  www.dingdonghaoka.com;  # 服务器名，可以是域名或IP地址

         # SSL证书和密钥配置
         ssl_certificate /usr/local/nginx/ssl/18632265_www.dingdonghaoka.com_nginx/www.dingdonghaoka.com.pem;
         ssl_certificate_key /usr/local/nginx/ssl/18632265_www.dingdonghaoka.com_nginx/www.dingdonghaoka.com.key;
                     	    	    	    		
         # SSL调优
         ssl_session_cache    shared:SSL:1m;
         ssl_session_timeout  5m;

         ssl_ciphers  HIGH:!aNULL:!MD5;
         ssl_prefer_server_ciphers  on;

	location / {
            root   /opt/console/dist;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location /prod-api/ {  # 反向代理到后端工程
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://123.56.214.102:8080/;
       }
    
    }
	
    server {
         listen 443 ssl;  # 监听443端口
         server_name  api.dingdonghaoka.com;  # 服务器名，可以是域名或IP地址

         # SSL证书和密钥配置
         ssl_certificate /usr/local/nginx/ssl/18629343_api.dingdonghaoka.com_nginx/api.dingdonghaoka.com.pem;
         ssl_certificate_key /usr/local/nginx/ssl/18629343_api.dingdonghaoka.com_nginx/api.dingdonghaoka.com.key;
                     	    	    	    		
         # SSL调优
         ssl_session_cache    shared:SSL:1m;
         ssl_session_timeout  5m;

         ssl_ciphers  HIGH:!aNULL:!MD5;
         ssl_prefer_server_ciphers  on;

        location /api/ {  # 反向代理到后端工程
			# 允许跨域请求的域名，* 表示允许所有域名访问
# 			add_header 'Access-Control-Allow-Origin' '*';
# 			# 允许跨域请求的方法
# 			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
# 			# 允许跨域请求的自定义 Header
# 			add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
# 			# 允许跨域请求的 Credential
# 			add_header 'Access-Control-Allow-Credentials' 'true';
# 			# 预检请求的存活时间，即 Options 请求的响应缓存时间
# 			add_header 'Access-Control-Max-Age' 3600;
# 			# 处理预检请求
# 			if ($request_method = 'OPTIONS') {
# 				return 204;
# 			}
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://123.56.214.102:8081/;
       }
    
    }
    
