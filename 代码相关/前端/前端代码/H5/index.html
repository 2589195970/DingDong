<!doctype html>
<html lang="zh-cn">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>官方包邮</title>
	<!-- <link rel="shortcut icon" type="image/x-icon" href="./img/log.png" /> -->
	<link rel="stylesheet" href="./css/vant@2.9.min.css" />
	<link rel="stylesheet" href="./css/from.css">
	<script src="./js/vue.js"></script>
	<script src="./js/vant.js"></script>
	<link rel="stylesheet" href="./index.css">
</head>

<body>
	<div id="app">
		<div id="p-con">
			<!-- 产品主图 -->
			<div style="position: relative;">
				<img class="full-img" :src="productList.productMasterMap" alt="" />
			</div>
			<!-- 步骤导航 -->
			<div class="step-indicator" v-if="productList.photoRequired == 1">
				<div class="step-item" :class="{'step-active': currentStep === 1, 'step-inactive': currentStep !== 1}">
					<span class="step-number">1</span>
					<span class="step-text">填写基础信息</span>
				</div>
				<span style="color: #ccc; margin: 0 15px;">→</span>
				<div class="step-item" :class="{'step-active': currentStep === 2, 'step-inactive': currentStep !== 2}">
					<span class="step-number">2</span>
					<span class="step-text">上传照片</span>
				</div>
			</div>

			<div class="form-con">
				<div class="form">
				<van-notice-bar
					v-if="Number(productList.productType) === 5"
						class="paid-notice"
						color="#8B4513"
						background="#FFF8F0"
						left-icon="info-o"
						wrapable
					>
						温馨提示:该产品需支付提卡费用,请您确认后再提交订单
					</van-notice-bar>
					<van-form class="van-form" style="width: calc(100% - 0.7rem);border-radius: 10px;">
						<!-- 需要照片上传时的分步显示 -->
						<template v-if="productList.photoRequired == 1">
							<!-- 第一步：基础信息 -->
							<div v-show="currentStep === 1">
								<div class="chais1">
									<img class="chais" v-show="xiaos"
										src="https://staticcdn.xwtec.cn/static/taobaoH5/common/images/landing/cmcc/styles/lbjt19jrtt/chai1.gif"
										alt="">
								</div>
								<van-field @blur="loseName" @focus='focusName' v-model="name" label="姓名"
									placeholder="请输入收件人姓名(已加密)" required clearable></van-field>
								<div class="regname" v-if='xiaos1'>&nbsp;&nbsp;&nbsp;&nbsp;*姓名<span>未填写</span>，请填写办理人的姓名
								</div>
								<van-field v-model="phone" type="number" label="联系方式" placeholder="请输入收件人电话，并保持畅通" required
									clearable :maxlength="11" @blur="lose"></van-field>
								<div class="regname" v-if='xiaos2'>
									&nbsp;&nbsp;&nbsp;&nbsp;*收货号码<span>未填写</span>，请填写办理人常用号码作为收货号码</div>
								<van-field v-model="idCardNo" label="身份证" placeholder="未满18周岁请勿下单(已加密)" required clearable
									:maxlength="18"></van-field>

								<van-field v-model="region" label="配送地区" placeholder="请选择所在地区" required
									@click="areaVisible=true">
									<template #right-icon>
										<van-icon name="arrow" />
									</template>
								</van-field>

								<van-field v-model="address" rows="1" label="详细地址" required
									placeholder="如街道/小区/门牌号" @blur="loseAddress"></van-field>

								<div style="text-align: center; margin: 15px 0;">
									<img src="./img/an.gif" class="btn-primary-img" id="btnNextStep" alt="" @click="nextStep" />
								</div>
							</div>

							<!-- 第二步：照片上传 -->
							<div v-show="currentStep === 2">
								<!-- 照片上传区域 -->
								<div class="photo-upload-section">
									<div class="photo-upload-container">
										<div v-for="(photoConfig, index) in photoConfigList" :key="photoConfig.photoType"
											v-if="photoConfig.required == 1"
											:class="['photo-upload-item', {'required': photoConfig.required == 1}]">

											<!-- 照片上传卡片 -->
											<div class="photo-card">
												<div class="photo-card-header">
													<div class="photo-title">
														<span v-if="photoConfig.required == 1" class="required">*</span>
														{{ photoConfig.title }}
													</div>
												</div>

												<div class="photo-card-content">
													<!-- 左侧上传区域 -->
													<div class="upload-section">
														<!-- 上传区域 -->
														<div class="upload-area" v-if="!uploadedPhotos[photoConfig.photoType]"
															@click="triggerFileInput(photoConfig.photoType)">
															<div class="upload-placeholder">
																<div class="upload-icon"></div>
																<div class="upload-text">点击上传{{ photoConfig.title }}</div>
																<div class="upload-hint">支持 {{ photoConfig.supportedFormats }} 格式</div>
															</div>
															<input type="file"
																:ref="'fileInput' + photoConfig.photoType"
																accept="image/*"
																style="display: none"
																@change="handleFileSelect($event, photoConfig)">
														</div>

														<!-- 上传中状态 -->
														<div class="upload-area uploading" v-else-if="uploadedPhotos[photoConfig.photoType].uploading">
															<div class="upload-placeholder">
																<div class="upload-text">正在上传{{ photoConfig.title }}...</div>
																<div class="upload-hint">请稍候</div>
															</div>
														</div>

														<!-- 预览区域 -->
														<div class="preview-area" v-else>
															<div class="preview-image-container">
																<img :src="uploadedPhotos[photoConfig.photoType].preview"
																	:alt="photoConfig.title"
																	class="preview-image"
																	@click="previewFullImage(uploadedPhotos[photoConfig.photoType].preview)">
																<div class="preview-actions">
																	<button class="action-btn delete-btn"
																		@click.stop="removePhoto(photoConfig.photoType)">
																		删除
																	</button>
																</div>
															</div>
														</div>
													</div>

													<!-- 右侧示例图片 -->
													<div class="example-section">
														<div class="photo-example" v-if="photoConfig.exampleUrl"
															@click="previewFullImage(photoConfig.exampleUrl)">
															<img
																:src="photoConfig.exampleUrl"
																:alt="photoConfig.title + '示例'"
															>
														</div>
													</div>
												</div>

												<!-- 照片说明 -->
												<div class="photo-description" v-if="photoConfig.description">
													{{ photoConfig.description }}
												</div>
											</div>
										</div>
									</div>
								</div>

								<div style="text-align: center; margin: 15px 0;">
									<a @click="prevStep" style="color: #4EAAEF; font-size: 14px; margin-right: 20px;">返回上一步</a>
									<img src="./img/an.gif" class="btn-primary-img" id="btnSubmit" alt="" @click="submit" />
								</div>
							</div>

							<p class="protocol" v-show="currentStep === 2">
								<van-checkbox v-model="protocolChecked" checked-color="#4EAAEF"
									class="checkbox"></van-checkbox>
								<span>我已阅读</span>
								<a @click="protocolVisible1=true">《入网协议》</a>
								<span>和</span>
								<a @click="protocolVisible2=true">《信息收集公告》</a>
							</p>

					<p class="paid-tip" v-if="Number(productList.productType) === 5 && currentStep === 2">
								<van-checkbox v-model="paidCardConfirmed" checked-color="#4EAAEF"
									class="checkbox"></van-checkbox>
								<span>我已了解该产品需支付提卡费用</span>
							</p>
						</template>

						<!-- 不需要照片上传时的单步显示 -->
						<template v-else>
							<div class="chais1">
								<img class="chais" v-show="xiaos"
									src="https://staticcdn.xwtec.cn/static/taobaoH5/common/images/landing/cmcc/styles/lbjt19jrtt/chai1.gif"
									alt="">
							</div>
							<van-field @blur="loseName" @focus='focusName' v-model="name" label="姓名"
								placeholder="请输入收件人姓名(已加密)" required clearable></van-field>
							<div class="regname" v-if='xiaos1'>&nbsp;&nbsp;&nbsp;&nbsp;*姓名<span>未填写</span>，请填写办理人的姓名
							</div>
							<van-field v-model="phone" type="number" label="联系方式" placeholder="请输入收件人电话，并保持畅通" required
								clearable :maxlength="11" @blur="lose"></van-field>
							<div class="regname" v-if='xiaos2'>
								&nbsp;&nbsp;&nbsp;&nbsp;*收货号码<span>未填写</span>，请填写办理人常用号码作为收货号码</div>
							<van-field v-model="idCardNo" label="身份证" placeholder="未满18周岁请勿下单(已加密)" required clearable
								:maxlength="18"></van-field>

							<van-field v-model="region" label="配送地区" placeholder="请选择所在地区" required
								@click="areaVisible=true">
								<template #right-icon>
									<van-icon name="arrow" />
								</template>
							</van-field>

							<van-field v-model="address" rows="1" label="详细地址" required
								placeholder="如街道/小区/门牌号" @blur="loseAddress"></van-field>

							<div>
								<img src="./img/an.gif" class="btn-primary-img" id="btnPrimary" alt="" @click="submit" />
							</div>

							<p class="protocol">
								<van-checkbox v-model="protocolChecked" checked-color="#4EAAEF"
									class="checkbox"></van-checkbox>
								<span>我已阅读</span>
								<a @click="protocolVisible1=true">《入网协议》</a>
								<span>和</span>
								<a @click="protocolVisible2=true">《信息收集公告》</a>
							</p>

					<p class="paid-tip" v-if="Number(productList.productType) === 5">
								<van-checkbox v-model="paidCardConfirmed" checked-color="#4EAAEF"
									class="checkbox"></van-checkbox>
								<span>我已了解该产品需支付提卡费用</span>
							</p>
						</template>
					</van-form>
				</div>
			</div>
			<!-- 默认展开图片 -->
			<div>
				<img class="full-img" :src="productList.productDetailMap" alt="" />
			</div>

			<!-- 隐藏说明 -->
			<!-- <div class="noneHref" @click="noneHref()">
				<p class="noneHref_p">免流规则 >></p>
				<div class="noneDiv" v-if="noneDiv">
					
				</div>
			</div> -->

			<img v-if="config.submitBtnImg && backTopBtnVisible" :src="config.submitBtnImg.url" class="back-btn" alt=""
				@click="scrollToTop()" />

			<!-- 查询订单悬浮按钮 -->
			<div class="float-order-btn" @click="goToOrderQuery">
				<span>查询订单</span>
			</div>

			<!-- 地区弹窗 -->
			<van-popup v-model="areaVisible" class="area-popup" position="bottom">
				<van-area title="选择地区" :area-list="areaList" @confirm="handleAreaConfirm"
					@cancel="areaVisible=false"></van-area>
			</van-popup>

			<!-- 提交成功弹窗 -->
			<van-popup v-model="successModalVisible" class="success-popup" :close-on-click-overlay="false"
				:overlay-style="{ backgroundColor: 'rgba(0,0,0,.5)' }">
				<div class="success-modal-con">
						<div class="success-modal">
					<img :src="Number(productList.productType) === 5 ? './img/fwtk.png' : './img/cg.jpg'" alt="">
					</div>
					<van-icon class="icon" name="close" @click="successModalVisible=false" />
				</div>
			</van-popup>
			<!-- 协议弹窗 -->
			<van-dialog v-model="protocolVisible1" title="隐私权政策、用户协议" confirm-button-text="我知道了">
				<div class="dialog-content-con" v-html="protocolHtml1">
				</div>
			</van-dialog>

			<!-- 产品信息及权益 -->
			<van-dialog v-model="protocolVisible2" title="产品信息及会员权益" confirm-button-text="我知道了">
				<div class="dialog-content-con" v-html="protocolHtml2">
				</div>
			</van-dialog>

			<!-- 图片预览弹窗 -->
			<van-popup v-model="imagePreviewVisible" class="image-preview-popup" position="center">
				<div class="image-preview-container">
					<img :src="previewImageUrl" alt="预览图片" class="preview-full-image" />
					<div class="preview-close" @click="imagePreviewVisible = false">
						<van-icon name="close" />
					</div>
				</div>
			</van-popup>
		</div>
	</div>
</body>
<script src="./js/axios.js"></script>
<script src="./js/util.js"></script>
<script src="./js/area.js"></script>
<script type="text/javascript" src="./index.js"></script>

</html>
