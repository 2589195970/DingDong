# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: release
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    public:
      database: 1
      host: test.sdzdf.com
      port: 8006
      password: sdzdfredis20241206
      timeout: 5000
    config:
      database: 2
      host: test.sdzdf.com
      port: 8006
      password: sdzdfredis20241206
      timeout: 5000
    address:
      database: 3
      host: test.sdzdf.com
      port: 8006
      password: sdzdfredis20241206
      timeout: 5000
    temporarily:
      database: 4
      host: test.sdzdf.com
      port: 8006
      password: sdzdfredis20241206
      timeout: 5000
    lettuce:
      pool:
        max-active: 10
        max-wait: 10000
        max-idle: 5
        min-idle: 3
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://123.56.89.151:3306/numbercard?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&failOverReadOnly=false&allowPublicKeyRetrieval=true
        username: root
        password: 94loaUawkU0SuUJV@
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 100
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow: ""
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: ruoyi
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

rocket-mq:
  accessKey: dev
  secretKey: dev
  nameSrvAddr: http://123.56.89.151/:9876
  groupId: GID_MC_PUSH
  consumeThreadNums: 5
  consumeTimeout: 100000
  reconsumeTimes: 3
  suspendTimeMillis: 30000

submit:
  h5: https://h5.dingdonghaoka.com/

doudian:
  batchDecryptUrl: https://xxxxxxxx

server:
  port: 8081

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# MyBatisPlus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/*Mapper.xml
  # 加载全局的配置文件
  # configLocation: classpath:mybatis/mybatis-config.xml
  type-handlers-package: com.ruoyi.common.pojo.main.handler.AESEncipherTypeHandler
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

okhttp:
  timeout: 15000
  maxConnection: 20
  maxIdleConnections: 5
  keepAliveDurationMill: 15000
  resetConnection: true
  maxHostConnection: 20