# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.8
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: release
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

rocket-mq:
  accessKey: dev
  secretKey: dev
  nameSrvAddr: http://123.56.89.151/:9876
  groupId: GID_MC_PUSH
  consumeThreadNums: 5
  consumeTimeout: 100000
  reconsumeTimes: 3
  suspendTimeMillis: 30000

submit:
  h5: https://h5.dingdonghaoka.com/

doudian:
  batchDecryptUrl: https://xxxxxxxx

server:
  port: 8081

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# MyBatisPlus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/*Mapper.xml
  # 加载全局的配置文件
  # configLocation: classpath:mybatis/mybatis-config.xml
  type-handlers-package: com.ruoyi.common.pojo.main.handler.AESEncipherTypeHandler
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

okhttp:
  timeout: 15000
  maxConnection: 20
  maxIdleConnections: 5
  keepAliveDurationMill: 15000
  resetConnection: true
  maxHostConnection: 20